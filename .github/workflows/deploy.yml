name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Prepare static site for GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .output/public/index.html ]]; then
            BUILD_DIR=".output/public"
          elif [[ -f dist/client/index.html ]]; then
            BUILD_DIR="dist/client"
          elif [[ -f dist/index.html ]]; then
            BUILD_DIR="dist"
          else
            echo "Could not find generated index.html. Build output:" >&2
            find . -maxdepth 4 -name index.html -not -path './node_modules/*' -print >&2
            exit 1
          fi

          echo "Using build directory: ${BUILD_DIR}"
          cp "${BUILD_DIR}/index.html" "${BUILD_DIR}/404.html"
          touch "${BUILD_DIR}/.nojekyll"
          echo "BUILD_DIR=${BUILD_DIR}" >> "$GITHUB_ENV"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.BUILD_DIR }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
