
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Prepare static site
        run: |
          set -e

          BUILD_DIR=".output/public"

          if [ ! -f "$BUILD_DIR/_shell.html" ]; then
            echo "ERROR: _shell.html not found"
            echo "Contents of .output/public:"
            ls -la "$BUILD_DIR"
            exit 1
          fi

          cp "$BUILD_DIR/_shell.html" "$BUILD_DIR/index.html"
          cp "$BUILD_DIR/_shell.html" "$BUILD_DIR/404.html"
          touch "$BUILD_DIR/.nojekyll"

          echo "=== FINAL FILES ==="
          ls -la "$BUILD_DIR"

          test -f "$BUILD_DIR/index.html"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: .output/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
