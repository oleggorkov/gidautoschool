name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Fix SPA routing and bypass Jekyll
        run: |
          # Определяем папку сборки
          if [ -d "./dist/client/assets" ]; then
            BUILD_DIR="./dist/client"
          elif [ -d "./.output/public/assets" ]; then
            BUILD_DIR="./.output/public"
          elif [ -d "./dist/assets" ]; then
            BUILD_DIR="./dist"
          else
            echo "❌ ОШИБКА: Папка с ассетами (assets) не найдена!"
            exit 1
          fi
          
          echo "✅ Папка сборки: $BUILD_DIR"
          echo "BUILD_DIR=$BUILD_DIR" >> $GITHUB_ENV
          
          # Если index.html нет в папке сборки, копируем его из корня проекта
          if [ ! -f "$BUILD_DIR/index.html" ]; then
            if [ -f "./index.html" ]; then
              echo "Копируем index.html из корня в $BUILD_DIR"
              cp ./index.html "$BUILD_DIR/index.html"
            else
              echo "❌ ОШИБКА: index.html не найден ни в сборке, ни в корне проекта!"
              exit 1
            fi
          fi
          
          cd "$BUILD_DIR"
          cp index.html 404.html
          touch .nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.BUILD_DIR }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
