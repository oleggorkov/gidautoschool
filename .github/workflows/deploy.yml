name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Fix SPA routing and bypass Jekyll
        run: |
          # Ищем, в какую папку Vite сложил index.html
          if [ -f "./dist/client/index.html" ]; then
            BUILD_DIR="./dist/client"
          elif [ -f "./.output/public/index.html" ]; then
            BUILD_DIR="./.output/public"
          elif [ -f "./dist/index.html" ]; then
            BUILD_DIR="./dist"
          else
            echo "❌ ОШИБКА: index.html не найден в стандартных папках!"
            exit 1
          fi
          
          echo "✅ Нашли index.html в папке: $BUILD_DIR"
          echo "BUILD_DIR=$BUILD_DIR" >> $GITHUB_ENV
          
          cd "$BUILD_DIR"
          cp index.html 404.html
          touch .nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Загружаем ту папку, которую нашли на предыдущем шаге
          path: ${{ env.BUILD_DIR }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
